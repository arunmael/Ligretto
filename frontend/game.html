<!DOCTYPE html>
<html lang="de-ch">
    <head>
        <meta charset="utf-8">

        <!-- main.js startet die Spielseite und importiert selbst create-stack.js, move-cards.js und rules.js -->
        <script type="module" src="main.js"></script>
        <script type="module" src="create-stack.js"></script>
        <script type="module" src="move-cards.js"></script>

        <title>Ligretto</title>

        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="game.css">
    </head>
    <body>
        <!-- Kopfzeile mit Button zurück zur Startseite -->
        <header>
            <h1>Los gehts</h1>
            <button type="button" id="joinOtherRoom">Trette einem anderen Room bei</button>
        </header>
        <!-- Spielfeld: 3×3-Raster, Spieler oben/links/rechts/unten, gemeinsames Spielfeld in der Mitte -->
        <main>
            <!-- Jeder Spielerbereich: offene Karten, Zehnerstapel, verdeckte und aufgedeckte Handkarten -->
            <div class="playerDeck" id="playerDeckTop">
                <div class="openCards" id="openCardsTop"></div>
                <div class="tenStack" id="tenStackTop"></div>
                <div class="handCardsClosed" id="handCardsTopClosed"></div>
                <div class="handCardsOpen" id="handCardsTopOpen"></div>
            </div>

            <div class="playerDeck" id="playerDeckLeft">
                <div class="openCards" id="openCardsLeft"></div>
                <div class="tenStack" id="tenStackLeft"></div>
                <div class="handCardsClosed" id="handCardsLeftClosed"></div>
                <div class="handCardsOpen" id="handCardsLeftOpen"></div>
            </div>

            <!-- gemeinsames Spielfeld, die 16 Felder erzeugt createPlayArea() -->
            <div id="playArea">
            </div>

            <div class="playerDeck" id="playerDeckRight">
                <div class="openCards" id="openCardsRight"></div>
                <div class="tenStack" id="tenStackRight"></div>
                <div class="handCardsClosed" id="handCardsRightClosed"></div>
                <div class="handCardsOpen" id="handCardsRightOpen"></div>
            </div>

            <!-- eigener Spieler: nur dieser Bereich wird bisher von createDOMStack() befüllt -->
            <div class="playerDeck" id="playerDeckBottom">
                <div class="openCards" id="openCardsBottom"></div>
                <div class="tenStack" id="tenStackBottom"></div>
                <div class="handCardsClosed" id="handCardsBottomClosed"></div>
                <div class="handCardsOpen" id="handCardsBottomOpen"></div>
            </div>
        </main>
        <footer>
            <p>Gemacht von Arun©</p>
            <nav>
                <a href="rules.html">Rules  </a>
            </nav>
        </footer>
    </body>
</html>
