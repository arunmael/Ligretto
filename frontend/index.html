<!-- Startseite mit RoomID-Eingabe, Farbwahl und Aktionen zum Beitreten oder Erstellen eines Raums. -->
<!DOCTYPE html>
<html lang="de-ch">
    <head>
        <meta charset="utf-8">

        <script type="module" src="login.js"></script>

        <title>Join Ligretto</title>

        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Willkommen bei Ligretto</h1>
        </header>
        <main>
            <!-- Login: RoomID und Farbe wählen, login.js schickt sie ans Backend und übergibt sie per URL an game.html -->
            <form id="loginForm">
                <label for="roomIdInput">Gib die RoomID ein</label>
                <input type="text" name="roomId" id="roomIdInput" placeholder="zb. 1A34">
                <label for="chosenColor">Wähle dein Kartenfarbe</label>
                <select name="chosenColor" id="chosenColor">
                    <option value="blue">Blau</option>
                    <option value="green">Grün</option>
                    <option value="yellow">Gelb</option>
                    <option value="pink">Pink</option>
                </select>
                <!-- submit löst das "submit"-Event des Formulars aus -->
                <button type="submit" id="submitRoomId">Beitreten</button>
                <!-- type="button" verhindert, dass dieser Button das Formular absendet -->
                <button type="button" id="createRoomButton">Erstelle einen neuen Room</button>
            </form>
            <!-- Warteraum: erscheint nach erfolgreichem Beitreten oder Erstellen anstelle des Formulars (login.js, openLobbyScreen) -->
            <div id="loadingScreen">
                <h3>Starte das Spiel sobald alle Spieler bereit sind</h3>
                <button type="button" id="startGame">Starte das Spiel</button>
                <button type="button" id="joinOtherLobbey">Geh zurück in die Lobby</button>
            </div>
        </main>
        <footer>
            <p>Gemacht von Arun©</p>
            <nav>
                <a href="rules.html">Rules  </a>
            </nav>
        </footer>
    </body>
</html>
