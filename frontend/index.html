<!DOCTYPE html>
<html lang="de-ch">
    <head>
        <meta charset="utf-8">

        <script type="module" src="login.js"></script>

        <title>Join Ligretto</title>

        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Willkommen bei Ligretto</h1>
        </header>
        <main>
                <!-- Login: RoomID und Farbe wählen, login.js speichert sie in sessionStorage -->
                <form id="loginForm">
                    <label for="roomId">Gib die RoomID ein</label>
                    <input type="text" name="roomId" id="roomIdInput" placeholder="zb. 1A34">
                    <label for="chosenColor">Wähle dein Kartenfarbe</label>
                    <select name="chosenColor" id="chosenColor">
                        <option value="blue">Blau</option>
                        <option value="green">Grün</option>
                        <option value="yellow">Gelb</option>
                        <option value="pink">Pink</option>
                    </select>
                    <!-- submit löst das "submit"-Event des Formulars aus -->
                    <button type="submit" id="submitRoomId">Beitreten</button>
                    <!-- type="button" verhindert, dass dieser Button das Formular absendet -->
                    <button type="button" id="createRoomButton">Erstelle einen neuen Room</button>
                </form>
        </main>
        <footer>
            <p>Gemacht von Arun©</p>
            <nav>
                <a href="rules.html">Rules  </a>
            </nav>
        </footer>
    </body>
</html>
